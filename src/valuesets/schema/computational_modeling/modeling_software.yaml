        description: Python toolbox for parameter estimation, profiling and sampling.
        see_also:
        - https://github.com/ICB-DCM/pyPESTO
        annotations:
          roles: PARAMETER_INFERENCE
          frameworks: ODE
          formats: SBML
          experiment_formats: PETAB
      DATA2DYNAMICS:
        title: Data2Dynamics
        description: MATLAB framework for parameter estimation and identifiability analysis of ODE models.
        see_also:
        - https://github.com/Data2Dynamics/d2d
        annotations:
          roles: PARAMETER_INFERENCE
          frameworks: ODE
          formats: SBML|GENERAL_PURPOSE_CODE
          experiment_formats: PETAB
