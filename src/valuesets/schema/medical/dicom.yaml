        meaning: NCIT:C38101
        exact_mappings:
        - DCM:RG
        aliases:
        - Radiographic imaging
      RTIMAGE:
        title: RT Image
        description: Radiotherapy portal or setup image
        meaning: DCM:RTIMAGE
      SM:
        title: Slide Microscopy
        description: Whole slide imaging of microscope slides
        meaning: DCM:SM
      SRF:
        title: Subjective Refraction
        description: Refraction measured with patient feedback
        meaning: DCM:SRF
      TG:
        title: Thermography
        description: Imaging of body surface temperature
        meaning: NCIT:C17194
        exact_mappings:
        - DCM:TG
      US:
        title: Ultrasound Imaging
