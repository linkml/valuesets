name: dicom
title: DICOM Standard Value Sets
description: >-
  Value sets drawn from the Digital Imaging and Communications in Medicine (DICOM)
  standard (ISO 12052), the internationally recognized format for storing, transmitting
  and managing medical imaging data. Covers the acquisition modality codes used in the
  Modality (0008,0060) attribute, the Value Representations (VRs) that govern attribute
  encoding, the attribute requirement types (1, 1C, 2, 2C, 3) used in Information Object
  Definitions, the registered transfer syntaxes that define byte ordering and pixel data
  compression, the DIMSE and DICOMweb network services used to query and retrieve images
  from PACS, and the open-source toolkits commonly used to read, validate and serve DICOM
  files.

  These value sets support the medical imaging data lifecycle described in "Toward AI-Ready
  Medical Imaging Data" (Nikolov et al., Bridge2AI consortium), in particular the data
  extraction, conformance checking and metadata tag validation stages, where VR, VM and
  attribute type rules are checked with tools such as dciodvfy, dcentvfy, DVTk and pydicom.

  Codes that come from the DICOM standard itself (modality codes, VRs, action codes) are
  kept in their standard form rather than being upper-cased or expanded.
id: https://w3id.org/valuesets/medical/dicom
imports:
- linkml:types
prefixes:
  linkml: https://w3id.org/linkml/
  valuesets: https://w3id.org/valuesets/
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  DCM: http://dicom.nema.org/resources/ontology/DCM/
  orcid: https://orcid.org/
  valuesets_meta: https://w3id.org/valuesets/meta/
default_prefix: valuesets
slots:
  dicom_modality:
    description: The DICOM acquisition modality code of an imaging instance or series
    range: DICOMModalityEnum
  dicom_value_representation:
    description: The DICOM Value Representation (VR) of an attribute
    range: DICOMValueRepresentationEnum
  dicom_attribute_type:
    description: The DICOM attribute requirement type of an attribute within an IOD module
    range: DICOMAttributeTypeEnum
  dicom_transfer_syntax:
    description: The DICOM transfer syntax used to encode a data set or its pixel data
    range: DICOMTransferSyntaxEnum
  dicom_network_service:
    description: The DICOM network service used to query, retrieve or store instances
    range: DICOMNetworkServiceEnum
  dicom_software_tool:
    description: A software toolkit, validator, server or library used to process DICOM data
    range: DICOMSoftwareToolEnum
enums:
  DICOMModalityEnum:
    title: DICOM Acquisition Modality
    description: >-
      Acquisition modality codes from DICOM PS3.16 Context ID 29 (Acquisition Modality),
      the defined terms for the Modality (0008,0060) attribute. The permissible value is the
      DICOM code itself; the title is the NCI Thesaurus label where a mapping exists and the
      DICOM code meaning is carried as an alias when it differs. Waveform modalities (ECG,
      EEG, etc.) are defined in CID 34 and are not included here.
    status: DRAFT
    contributors:
    - orcid:0000-0002-6601-2165
    - https://github.com/anthropics/claude-code
    see_also:
    - https://dicom.nema.org/medical/dicom/current/output/chtml/part16/sect_CID_29.html
    instantiates:
    - valuesets_meta:ValueSetEnumDefinition
    permissible_values:
      AR:
        title: Autorefraction
        description: Automated measurement of refractive error of the eye
        meaning: NCIT:C176330
        exact_mappings:
        - DCM:AR
      BI:
        title: Biomagnetic Imaging
        description: Imaging based on magnetic fields produced by the body, such as magnetoencephalography
        meaning: DCM:BI
      BMD:
        title: Bone Mineral Densitometry
        description: Measurement of bone mineral content and density, such as DXA
        meaning: NCIT:C190514
        exact_mappings:
        - DCM:BMD
      CR:
        title: Computed Radiography
        description: X-ray imaging using a phosphor imaging plate read out to a digital image
        meaning: NCIT:C190521
        exact_mappings:
        - DCM:CR
      CT:
        title: Computed Tomography
        description: Cross-sectional X-ray imaging reconstructed by computer
        meaning: NCIT:C17204
        exact_mappings:
        - DCM:CT
      CFM:
        title: Confocal Microscopy
        description: Laser-scanning microscopy that rejects out-of-focus light
        meaning: NCIT:C17753
        exact_mappings:
        - DCM:CFM
      DMS:
        title: Dermoscopy
        description: Non-invasive microscopic examination of the skin surface
        meaning: NCIT:C116478
        exact_mappings:
        - DCM:DMS
      DG:
        title: Diaphanography
        description: Transillumination imaging of tissue, historically used for the breast
        meaning: DCM:DG
      DX:
        title: Digital Radiography
        description: Projection X-ray imaging acquired directly with a digital detector
        meaning: NCIT:C18001
        exact_mappings:
        - DCM:DX
      ES:
        title: Endoscopic Procedure
        description: Imaging from an endoscope inserted into a body cavity or organ, including laryngoscopy and video endoscopy
        meaning: NCIT:C16546
        exact_mappings:
        - DCM:ES
        aliases:
        - Endoscopy
      XC:
        title: External-camera Photography
        description: Visible-light photography of the patient with an external camera
        meaning: DCM:XC
      GM:
        title: Microscopy
        description: General microscopy not otherwise classified
        meaning: NCIT:C16853
        exact_mappings:
        - DCM:GM
        aliases:
        - General Microscopy
      IO:
        title: Intraoral Radiography
        description: Dental X-ray imaging with the detector inside the mouth
        meaning: NCIT:C190548
        exact_mappings:
        - DCM:IO
        aliases:
        - Intra-oral Radiography
      IVOCT:
        title: Intravascular Optical Coherence Tomography
        description: Catheter-based optical coherence tomography of blood vessels
        meaning: NCIT:C190550
        exact_mappings:
        - DCM:IVOCT
      IVUS:
        title: Intravascular Ultrasound
        description: Catheter-based ultrasound imaging of blood vessels
        meaning: NCIT:C99535
        exact_mappings:
        - DCM:IVUS
      KER:
        title: Keratometry
