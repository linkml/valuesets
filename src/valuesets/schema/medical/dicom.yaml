        meaning: NCIT:C190516
        exact_mappings:
        - DCM:BDUS
      VA:
        title: Visual Acuity
        description: Measurement of the sharpness of vision
        meaning: NCIT:C87149
        exact_mappings:
        - DCM:VA
      XA:
        title: X-ray Angiography
        description: X-ray imaging of blood vessels with contrast, including digital subtraction angiography
        meaning: NCIT:C20080
        exact_mappings:
        - DCM:XA

  DICOMValueRepresentationEnum:
    title: DICOM Value Representation
    description: >-
      The Value Representations (VRs) defined in DICOM PS3.5 Section 6.2, which specify the
      data type and format of the value of a data element. Tag validation tools check that
      each attribute is encoded with the VR required by the data dictionary. Permissible
      values are the two-letter DICOM VR codes.
    status: DRAFT
    contributors:
    - orcid:0000-0002-6601-2165
    - https://github.com/anthropics/claude-code
    see_also:
    - https://dicom.nema.org/medical/dicom/current/output/chtml/part05/sect_6.2.html
    instantiates:
    - valuesets_meta:ValueSetEnumDefinition
    permissible_values:
      AE:
        title: Application Entity
        description: A string identifying an Application Entity; 16 bytes maximum
        annotations:
          category: string
      AS:
        title: Age String
        description: Age in the format nnnD, nnnW, nnnM or nnnY (days, weeks, months, years)
        annotations:
          category: string
      AT:
        title: Attribute Tag
        description: An ordered pair of 16-bit unsigned integers that is the value of a data element tag
        annotations:
          category: binary
      CS:
        title: Code String
        description: A string identifying a controlled concept; uppercase letters, digits, space and underscore, 16 bytes maximum
        annotations:
          category: string
      DA:
        title: Date
        description: A date in the format YYYYMMDD
        annotations:
          category: date_time
      DS:
        title: Decimal String
        description: A string representing a fixed point or floating point number
        annotations:
          category: string
      DT:
        title: Date Time
        description: A concatenated date-time string of the form YYYYMMDDHHMMSS.FFFFFF&ZZXX
        annotations:
          category: date_time
      FL:
        title: Floating Point Single
        description: Single precision IEEE 754 binary32 floating point value
        annotations:
          category: binary
      FD:
        title: Floating Point Double
        description: Double precision IEEE 754 binary64 floating point value
        annotations:
          category: binary
      IS:
        title: Integer String
        description: A string representing a base-10 integer
        annotations:
          category: string
      LO:
        title: Long String
        description: A character string of up to 64 characters
        annotations:
          category: string
      LT:
        title: Long Text
        description: A character string that may contain one or more paragraphs, up to 10240 characters
        annotations:
          category: text
      OB:
        title: Other Byte
        description: An octet stream whose encoding is specified by the negotiated transfer syntax
        annotations:
          category: binary
      OD:
        title: Other Double
        description: A stream of IEEE 754 binary64 values
        annotations:
          category: binary
      OF:
        title: Other Float
        description: A stream of IEEE 754 binary32 values
        annotations:
          category: binary
      OL:
        title: Other Long
        description: A stream of 32-bit words
        annotations:
          category: binary
      OV:
        title: Other 64-bit Very Long
        description: A stream of 64-bit words
        annotations:
          category: binary
      OW:
        title: Other Word
        description: A stream of 16-bit words; commonly used for Pixel Data
        annotations:
          category: binary
      PN:
        title: Person Name
        description: A character string encoded using a five-component convention (family, given, middle, prefix, suffix)
        annotations:
          category: string
      SH:
        title: Short String
        description: A character string of up to 16 characters
        annotations:
          category: string
      SL:
        title: Signed Long
        description: Signed 32-bit two's complement integer
        annotations:
          category: binary
      SQ:
        title: Sequence of Items
        description: A sequence of zero or more items, each of which is a nested data set
        annotations:
          category: sequence
      SS:
        title: Signed Short
        description: Signed 16-bit two's complement integer
        annotations:
          category: binary
      ST:
        title: Short Text
        description: A character string that may contain one or more paragraphs, up to 1024 characters
        annotations:
          category: text
      SV:
        title: Signed 64-bit Very Long
        description: Signed 64-bit integer
        annotations:
          category: binary
      TM:
        title: Time
        description: A time in the format HHMMSS.FFFFFF
        annotations:
          category: date_time
      UC:
        title: Unlimited Characters
        description: A character string of unlimited length
        annotations:
          category: string
      UI:
        title: Unique Identifier (UID)
        description: A string of numeric components separated by periods, up to 64 characters, used for UIDs such as SOP Instance UIDs and transfer syntax UIDs
        annotations:
          category: string
      UL:
        title: Unsigned Long
        description: Unsigned 32-bit integer
        annotations:
          category: binary
      UN:
        title: Unknown
        description: An octet stream whose encoding of the contents is unknown
        annotations:
          category: binary
      UR:
        title: Universal Resource Identifier or Universal Resource Locator (URI/URL)
        description: A string identifying a URI or URL as defined in RFC 3986
        annotations:
          category: string
      US:
        title: Unsigned Short
        description: Unsigned 16-bit integer
        annotations:
          category: binary
      UT:
        title: Unlimited Text
        description: A character string that may contain one or more paragraphs, of unlimited length
        annotations:
          category: text
      UV:
        title: Unsigned 64-bit Very Long
        description: Unsigned 64-bit integer
        annotations:
          category: binary

  DICOMAttributeTypeEnum:
    title: DICOM Attribute Type
    description: >-
      Attribute requirement types defined in DICOM PS3.5 Section 7.4, which state whether an
      attribute must be present in a data set and whether it may have a zero-length value.
      Conformance checkers report missing Type 1 and Type 2 attributes as errors. These types
      also determine which de-identification action (D, Z or X) may be applied to an attribute.
    status: DRAFT
    contributors:
    - orcid:0000-0002-6601-2165
    - https://github.com/anthropics/claude-code
    see_also:
    - https://dicom.nema.org/medical/dicom/current/output/chtml/part05/sect_7.4.html
    instantiates:
    - valuesets_meta:ValueSetEnumDefinition
    permissible_values:
      TYPE_1:
        title: Type 1 (Required)
        description: The attribute shall be present with a valid non-zero-length value
        aliases:
        - "1"
      TYPE_1C:
        title: Type 1C (Conditionally Required)
        description: The attribute shall be present with a valid value when a specified condition is met, and shall not be present otherwise
        aliases:
        - 1C
      TYPE_2:
        title: Type 2 (Required, Empty if Unknown)
        description: The attribute shall be present but may have a zero-length value if the value is unknown
        aliases:
        - "2"
      TYPE_2C:
        title: Type 2C (Conditionally Required, Empty if Unknown)
        description: The attribute shall be present, possibly with zero length, when a specified condition is met
        aliases:
        - 2C
      TYPE_3:
        title: Type 3 (Optional)
        description: The attribute is optional and may be absent or present with or without a value
        aliases:
        - "3"

  DICOMTransferSyntaxEnum:
    title: DICOM Transfer Syntax
    description: >-
      Transfer syntaxes registered in DICOM PS3.6 Annex A that define the byte ordering, VR
      encoding and pixel data compression of a DICOM data set. Pixel data validation includes
      confirming that decompression from a lossy or lossless transfer syntax yields the
      expected bit depth and that no unintended data loss occurred. Video transfer syntaxes
      (MPEG-2, H.264, HEVC) are used for endoscopy and ultrasound cine acquisitions.
      Fragmentable variants of the MPEG transfer syntaxes and retired JPEG processes are
      omitted; the full registry is at the see_also link.
    status: DRAFT
    contributors:
    - orcid:0000-0002-6601-2165
    - https://github.com/anthropics/claude-code
    see_also:
    - https://dicom.nema.org/medical/dicom/current/output/chtml/part06/chapter_A.html
    instantiates:
    - valuesets_meta:ValueSetEnumDefinition
    permissible_values:
      IMPLICIT_VR_LITTLE_ENDIAN:
        title: Implicit VR Little Endian
        description: Default transfer syntax for DICOM; VRs are looked up from the data dictionary rather than encoded
        annotations:
          uid: 1.2.840.10008.1.2
          compression: none
      EXPLICIT_VR_LITTLE_ENDIAN:
        title: Explicit VR Little Endian
        description: Uncompressed encoding with VRs explicitly encoded in each data element
        annotations:
          uid: 1.2.840.10008.1.2.1
          compression: none
      ENCAPSULATED_UNCOMPRESSED_EXPLICIT_VR_LITTLE_ENDIAN:
        title: Encapsulated Uncompressed Explicit VR Little Endian
        description: Uncompressed pixel data encapsulated in fragments, one per frame
        annotations:
          uid: 1.2.840.10008.1.2.1.98
          compression: none
      DEFLATED_EXPLICIT_VR_LITTLE_ENDIAN:
        title: Deflated Explicit VR Little Endian
        description: Explicit VR Little Endian data set compressed as a whole with the deflate algorithm
        annotations:
          uid: 1.2.840.10008.1.2.1.99
          compression: lossless
      EXPLICIT_VR_BIG_ENDIAN:
        title: Explicit VR Big Endian (Retired)
        description: Big endian byte ordering with explicit VRs; retired but still encountered in legacy archives
        annotations:
          uid: 1.2.840.10008.1.2.2
          compression: none
          retired: 'true'
      JPEG_BASELINE_PROCESS_1:
        title: JPEG Baseline (Process 1)
        description: Default transfer syntax for lossy JPEG 8-bit image compression
        annotations:
          uid: 1.2.840.10008.1.2.4.50
          compression: lossy
      JPEG_EXTENDED_PROCESS_2_4:
        title: JPEG Extended (Process 2 & 4)
        description: Default transfer syntax for lossy JPEG 12-bit image compression (Process 4 only)
        annotations:
          uid: 1.2.840.10008.1.2.4.51
          compression: lossy
      JPEG_LOSSLESS_PROCESS_14:
        title: JPEG Lossless, Non-Hierarchical (Process 14)
        description: Lossless JPEG compression using any predictor
        annotations:
          uid: 1.2.840.10008.1.2.4.57
          compression: lossless
      JPEG_LOSSLESS_PROCESS_14_SV1:
        title: JPEG Lossless, Non-Hierarchical, First-Order Prediction (Process 14 [Selection Value 1])
        description: Default transfer syntax for lossless JPEG image compression
        annotations:
          uid: 1.2.840.10008.1.2.4.70
          compression: lossless
      JPEG_LS_LOSSLESS:
        title: JPEG-LS Lossless Image Compression
        description: Lossless compression using the JPEG-LS (ISO 14495) algorithm
        annotations:
          uid: 1.2.840.10008.1.2.4.80
          compression: lossless
      JPEG_LS_NEAR_LOSSLESS:
        title: JPEG-LS Lossy (Near-Lossless) Image Compression
        description: Near-lossless JPEG-LS compression with a bounded per-pixel error
        annotations:
          uid: 1.2.840.10008.1.2.4.81
          compression: lossy
      JPEG_2000_LOSSLESS_ONLY:
        title: JPEG 2000 Image Compression (Lossless Only)
        description: JPEG 2000 wavelet compression restricted to reversible (lossless) mode
        annotations:
          uid: 1.2.840.10008.1.2.4.90
          compression: lossless
      JPEG_2000:
        title: JPEG 2000 Image Compression
        description: JPEG 2000 wavelet compression, lossy or lossless
        annotations:
          uid: 1.2.840.10008.1.2.4.91
          compression: lossy or lossless
      JPEG_2000_MULTICOMPONENT_LOSSLESS_ONLY:
        title: JPEG 2000 Part 2 Multi-component Image Compression (Lossless Only)
        description: JPEG 2000 Part 2 multi-component transform, reversible mode only
        annotations:
          uid: 1.2.840.10008.1.2.4.92
          compression: lossless
      JPEG_2000_MULTICOMPONENT:
        title: JPEG 2000 Part 2 Multi-component Image Compression
        description: JPEG 2000 Part 2 multi-component transform, lossy or lossless
        annotations:
          uid: 1.2.840.10008.1.2.4.93
          compression: lossy or lossless
      JPIP_REFERENCED:
        title: JPIP Referenced
        description: Pixel data referenced via a JPEG 2000 Interactive Protocol URL rather than encoded in the data set
        annotations:
          uid: 1.2.840.10008.1.2.4.94
          compression: referenced
      JPIP_REFERENCED_DEFLATE:
        title: JPIP Referenced Deflate
        description: JPIP referenced pixel data with the remaining data set deflated
        annotations:
          uid: 1.2.840.10008.1.2.4.95
          compression: referenced
      MPEG2_MAIN_PROFILE_MAIN_LEVEL:
        title: MPEG2 Main Profile / Main Level
        description: MPEG-2 video compression for standard definition video
        annotations:
          uid: 1.2.840.10008.1.2.4.100
          compression: lossy
          media: video
      MPEG2_MAIN_PROFILE_HIGH_LEVEL:
        title: MPEG2 Main Profile / High Level
        description: MPEG-2 video compression for high definition video
        annotations:
          uid: 1.2.840.10008.1.2.4.101
          compression: lossy
          media: video
      MPEG4_AVC_H264_HIGH_PROFILE_LEVEL_4_1:
        title: MPEG-4 AVC/H.264 High Profile / Level 4.1
        description: H.264 video compression for high definition video
        annotations:
          uid: 1.2.840.10008.1.2.4.102
          compression: lossy
          media: video
      MPEG4_AVC_H264_BD_COMPATIBLE_HIGH_PROFILE_LEVEL_4_1:
        title: MPEG-4 AVC/H.264 BD-compatible High Profile / Level 4.1
        description: H.264 video compression constrained for Blu-ray Disc compatibility
        annotations:
          uid: 1.2.840.10008.1.2.4.103
          compression: lossy
          media: video
      MPEG4_AVC_H264_HIGH_PROFILE_LEVEL_4_2_2D:
        title: MPEG-4 AVC/H.264 High Profile / Level 4.2 For 2D Video
        description: H.264 video compression for 2D video at higher frame rates and resolutions
        annotations:
          uid: 1.2.840.10008.1.2.4.104
          compression: lossy
          media: video
      MPEG4_AVC_H264_HIGH_PROFILE_LEVEL_4_2_3D:
        title: MPEG-4 AVC/H.264 High Profile / Level 4.2 For 3D Video
        description: H.264 video compression for 3D (stereoscopic) video
        annotations:
          uid: 1.2.840.10008.1.2.4.105
          compression: lossy
          media: video
      MPEG4_AVC_H264_STEREO_HIGH_PROFILE_LEVEL_4_2:
        title: MPEG-4 AVC/H.264 Stereo High Profile / Level 4.2
        description: H.264 stereo high profile for stereoscopic video
        annotations:
          uid: 1.2.840.10008.1.2.4.106
          compression: lossy
          media: video
      HEVC_H265_MAIN_PROFILE_LEVEL_5_1:
        title: HEVC/H.265 Main Profile / Level 5.1
        description: HEVC video compression with 8-bit samples
        annotations:
          uid: 1.2.840.10008.1.2.4.107
          compression: lossy
          media: video
