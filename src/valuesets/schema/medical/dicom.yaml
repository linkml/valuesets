  DICOMNetworkServiceEnum:
    title: DICOM Network Service
    description: >-
      Network services used to query, retrieve and store DICOM instances between imaging
      systems such as PACS, modalities and research archives. Includes the classic DIMSE
      (DICOM Message Service Element) services of PS3.7 and the RESTful DICOMweb services of
      PS3.18. Cataloguing which services a source repository supports is part of the data
      landscape assessment that precedes extraction.
    status: DRAFT
    contributors:
    - orcid:0000-0002-6601-2165
    - https://github.com/anthropics/claude-code
    see_also:
    - https://dicom.nema.org/medical/dicom/current/output/chtml/part07/chapter_7.html
    - https://dicom.nema.org/medical/dicom/current/output/chtml/part18/PS3.18.html
    instantiates:
    - valuesets_meta:ValueSetEnumDefinition
    permissible_values:
      C_ECHO:
        title: C-ECHO
        description: DIMSE verification service used to test connectivity between two application entities
        annotations:
          protocol: DIMSE
      C_STORE:
        title: C-STORE
        description: DIMSE storage service that pushes a composite instance to a peer
        annotations:
          protocol: DIMSE
      C_FIND:
        title: C-FIND
        description: DIMSE query service that matches attributes against a peer's database at patient, study, series or instance level
        annotations:
          protocol: DIMSE
      C_MOVE:
        title: C-MOVE
        description: DIMSE retrieve service that instructs a peer to send matching instances to a named destination via C-STORE
        annotations:
          protocol: DIMSE
      C_GET:
        title: C-GET
        description: DIMSE retrieve service that returns matching instances on the same association
        annotations:
          protocol: DIMSE
      N_EVENT_REPORT:
        title: N-EVENT-REPORT
        description: DIMSE-N notification service used to report events on a normalized SOP instance
        annotations:
          protocol: DIMSE
      N_GET:
        title: N-GET
        description: DIMSE-N service that retrieves attribute values of a normalized SOP instance
        annotations:
          protocol: DIMSE
      N_SET:
        title: N-SET
        description: DIMSE-N service that modifies attribute values of a normalized SOP instance
        annotations:
          protocol: DIMSE
      N_ACTION:
        title: N-ACTION
        description: DIMSE-N service that requests an action on a normalized SOP instance, such as storage commitment
        annotations:
          protocol: DIMSE
      N_CREATE:
        title: N-CREATE
        description: DIMSE-N service that creates a normalized SOP instance
        annotations:
          protocol: DIMSE
      N_DELETE:
        title: N-DELETE
        description: DIMSE-N service that deletes a normalized SOP instance
        annotations:
          protocol: DIMSE
      QIDO_RS:
        title: QIDO-RS
        description: DICOMweb RESTful query service (Query based on ID for DICOM Objects) for searching studies, series and instances
        annotations:
          protocol: DICOMweb
      WADO_RS:
        title: WADO-RS
        description: DICOMweb RESTful retrieve service (Web Access to DICOM Objects) for retrieving studies, series, instances, frames, metadata and rendered images
        annotations:
          protocol: DICOMweb
      STOW_RS:
        title: STOW-RS
        description: DICOMweb RESTful store service (Store Over the Web) for uploading instances
        annotations:
          protocol: DICOMweb
      WADO_URI:
        title: WADO-URI
        description: Legacy DICOMweb URI-based retrieve service for single instances
        annotations:
          protocol: DICOMweb
      UPS_RS:
        title: UPS-RS
        description: DICOMweb RESTful worklist service for Unified Procedure Step management
        annotations:
          protocol: DICOMweb
      CUSTOM_API:
        title: Custom API
        description: A vendor- or institution-specific interface that is not a standard DICOM network service

  DICOMSoftwareToolEnum:
    title: DICOM Software Tool
    description: >-
      Software toolkits, libraries, validators, servers and platforms commonly used to read,
      write, validate, anonymize and serve DICOM data in research data management pipelines.
      The category annotation distinguishes general-purpose toolkits from conformance
      validators, archive servers and metadata anonymizers.
    status: DRAFT
    contributors:
    - orcid:0000-0002-6601-2165
    - https://github.com/anthropics/claude-code
    instantiates:
    - valuesets_meta:ValueSetEnumDefinition
    permissible_values:
      DCMTK:
        title: DCMTK
        description: OFFIS DICOM Toolkit; C/C++ libraries and command-line utilities implementing DICOM network services and file handling
        annotations:
          category: toolkit
          language: C++
          license: BSD
          url: https://dicom.offis.de/en/dcmtk/
      PYDICOM:
        title: pydicom
        description: Pure Python library for reading, modifying and writing DICOM files, including pixel data access
        annotations:
          category: toolkit
          language: Python
          license: MIT
          url: https://github.com/pydicom/pydicom
      GDCM:
        title: GDCM
        description: Grassroots DICOM; C++ library with Python and other bindings for DICOM file and image codec handling
        annotations:
          category: toolkit
          language: C++
          license: BSD
          url: https://sourceforge.net/projects/gdcm/
      DCM4CHE:
        title: dcm4che
        description: Java DICOM toolkit and the basis of the dcm4chee archive
        annotations:
          category: toolkit
          language: Java
          license: MPL/GPL/LGPL
          url: https://www.dcm4che.org/
      ITK:
        title: ITK
        description: Insight Toolkit; C++ image processing library with DICOM readers built on GDCM
        annotations:
          category: toolkit
          language: C++
          license: Apache-2.0
          url: https://itk.org/
      DVTK:
        title: DVTk
        description: DICOM Validation Toolkit; validates object conformance and network behaviour against the standard
        annotations:
          category: validator
          language: C#
          license: LGPL
          url: https://www.dvtk.org/
      DICOM3TOOLS:
        title: dicom3tools
        description: David Clunie's command-line utilities for creating, modifying, dumping and validating DICOM files
        annotations:
          category: validator
          language: C++
          license: BSD
          url: http://www.dclunie.com/dicom3tools.html
      DCIODVFY:
        title: dciodvfy
        description: dicom3tools utility that verifies a file against the Information Object Definition for its modality, reporting missing required attributes, incorrect VRs and values outside allowed ranges
        annotations:
          category: validator
          part_of: dicom3tools
      DCENTVFY:
        title: dcentvfy
        description: dicom3tools utility that checks consistency of entity-level attributes across multiple files, such as all instances in a series sharing the same Series Instance UID
        annotations:
          category: validator
          part_of: dicom3tools
      PIXELMED:
        title: PixelMed
        description: PixelMed Java DICOM toolkit, including the DicomCleaner metadata anonymizer
        annotations:
          category: toolkit
          language: Java
          license: BSD
          url: https://www.pixelmed.com/
      RSNA_CTP:
