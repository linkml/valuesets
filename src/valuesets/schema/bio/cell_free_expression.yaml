name: cell_free_expression
title: Cell-Free Expression Value Sets
description: >-
  Value sets for cell-free protein synthesis (CFPS), also known as cell-free
  expression or in vitro transcription-translation (TX-TL). Covers the source
  extracts/systems, reaction formats, energy regeneration substrates, and common
  applications used in synthetic biology, structural biology, and biomanufacturing.
id: https://w3id.org/valuesets/bio/cell_free_expression
imports:
- linkml:types
prefixes:
  linkml: https://w3id.org/linkml/
  valuesets: https://w3id.org/valuesets/
  CHEBI: http://purl.obolibrary.org/obo/CHEBI_
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_
  OBI: http://purl.obolibrary.org/obo/OBI_
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  BAO: http://www.bioassayontology.org/bao#BAO_
  orcid: https://orcid.org/
  valuesets_meta: https://w3id.org/valuesets/meta/
default_prefix: valuesets
slots:
  cell_free_system:
    description: The source extract or reconstituted system used for cell-free expression
    range: CellFreeExpressionSystemEnum
  cell_free_reaction_format:
    description: The physical configuration of the cell-free reaction
    range: CellFreeReactionFormatEnum
  energy_regeneration_substrate:
    description: Secondary energy substrate used to regenerate ATP/GTP in the reaction
    range: EnergyRegenerationSubstrateEnum
  cell_free_application:
    description: Application or use case for the cell-free expression reaction
    range: CellFreeApplicationEnum
enums:
  CellFreeExpressionSystemEnum:
    title: Cell-Free Expression Systems
    description: >-
      Source extracts and reconstituted systems used for cell-free protein
      synthesis. Crude lysate systems are derived from cell extracts, while
      reconstituted systems (e.g. PURE) are assembled from purified components.
    status: DRAFT
    contributors:
    - orcid:0000-0002-6601-2165
    - https://github.com/anthropics/claude-code
    see_also:
    - https://en.wikipedia.org/wiki/Cell-free_protein_synthesis
    instantiates:
    - valuesets_meta:ValueSetEnumDefinition
    permissible_values:
      ECOLI_EXTRACT:
        description: >-
          Escherichia coli crude cell extract (e.g. S30, S12), the most widely
          used prokaryotic cell-free system for high-yield protein production
        aliases:
        - E. coli extract
        - E. coli lysate
        - S30 extract
        - ECE
        broad_mappings:
        - BAO:0000366
        annotations:
          source_taxon: NCBITaxon:562
          extract_type: crude lysate
          domain: prokaryotic
      PURE_SYSTEM:
        description: >-
          Protein synthesis Using Recombinant Elements - a reconstituted system
          assembled from individually purified E. coli translation factors,
          ribosomes, and enzymes
        aliases:
        - PURE
        - PURExpress
        - reconstituted system
        broad_mappings:
        - BAO:0000366
        annotations:
          extract_type: reconstituted
          domain: prokaryotic
          advantage: defined composition, low nuclease/protease activity
      WHEAT_GERM_EXTRACT:
        description: >-
          Wheat germ (Triticum aestivum) extract, a eukaryotic system favored
          for expression of complex and difficult eukaryotic proteins
        aliases:
        - WGE
        - wheat germ system
        broad_mappings:
        - BAO:0000366
        annotations:
          source_taxon: NCBITaxon:4565
          extract_type: crude lysate
          domain: eukaryotic
      RABBIT_RETICULOCYTE_LYSATE:
        description: >-
          Rabbit (Oryctolagus cuniculus) reticulocyte lysate, a classic
          mammalian system for in vitro translation and protein labeling
        meaning: BAO:0000255
        aliases:
        - RRL
        - reticulocyte lysate
        - rabbit reticulocyte lysate format
        annotations:
          source_taxon: NCBITaxon:9986
          extract_type: crude lysate
          domain: eukaryotic
      INSECT_CELL_EXTRACT:
        description: >-
          Insect cell extract, typically from Spodoptera frugiperda (Sf21),
          supporting eukaryotic post-translational modifications
        aliases:
        - ICE
        - Sf21 extract
        - insect lysate
        broad_mappings:
        - BAO:0000366
        annotations:
          source_taxon: NCBITaxon:7108
          extract_type: crude lysate
          domain: eukaryotic
      HELA_EXTRACT:
        description: >-
          Human HeLa cell extract used for mammalian cell-free expression with
          authentic human translation machinery
        aliases:
        - HeLa lysate
        - human cell extract
        broad_mappings:
        - BAO:0000366
        annotations:
          source_taxon: NCBITaxon:9606
          extract_type: crude lysate
          domain: eukaryotic
      CHO_EXTRACT:
        description: >-
          Chinese hamster ovary (Cricetulus griseus) cell extract supporting
          glycosylation and disulfide bond formation
        aliases:
        - CHO lysate
        broad_mappings:
        - BAO:0000366
        annotations:
          source_taxon: NCBITaxon:10029
          extract_type: crude lysate
          domain: eukaryotic
      YEAST_EXTRACT:
        description: >-
          Yeast (Saccharomyces cerevisiae) cell extract for eukaryotic cell-free
          protein synthesis
        aliases:
        - S. cerevisiae extract
        - yeast lysate
        broad_mappings:
        - BAO:0000366
        annotations:
          source_taxon: NCBITaxon:4932
          extract_type: crude lysate
          domain: eukaryotic
      LEISHMANIA_EXTRACT:
        description: >-
          Leishmania tarentolae cell extract, a eukaryotic system supporting
          high yields and post-translational modifications
        aliases:
        - Leishmania tarentolae extract
        - LTE
        broad_mappings:
        - BAO:0000366
        annotations:
          source_taxon: NCBITaxon:5689
          extract_type: crude lysate
          domain: eukaryotic
      VIBRIO_NATRIEGENS_EXTRACT:
        description: >-
          Vibrio natriegens cell extract, an emerging fast-growing prokaryotic
          chassis for rapid, high-yield cell-free expression
        aliases:
        - V. natriegens extract
        - Vmax extract
        broad_mappings:
        - BAO:0000366
        annotations:
          source_taxon: NCBITaxon:691
          extract_type: crude lysate
          domain: prokaryotic
      TOBACCO_BY2_EXTRACT:
        description: >-
          Tobacco BY-2 (Nicotiana tabacum bright yellow-2) cell lysate, a plant
          eukaryotic cell-free system
        aliases:
        - BY-2 lysate
        - BYL
        broad_mappings:
        - BAO:0000366
        annotations:
          extract_type: crude lysate
          domain: eukaryotic

  CellFreeReactionFormatEnum:
    title: Cell-Free Reaction Formats
    description: >-
      Physical configurations of cell-free expression reactions, differing in how
      substrates are supplied and byproducts removed, which affects reaction
      duration and protein yield.
    status: DRAFT
    contributors:
    - orcid:0000-0002-6601-2165
    - https://github.com/anthropics/claude-code
    instantiates:
    - valuesets_meta:ValueSetEnumDefinition
    permissible_values:
      BATCH:
        description: >-
          Single closed reaction with all components mixed at the start; simplest
          format but limited by substrate depletion and byproduct accumulation
        aliases:
        - batch mode
        annotations:
          duration: short (hours)
      CONTINUOUS_EXCHANGE:
        description: >-
          Continuous-exchange cell-free (CECF) format with a semipermeable
          membrane separating a reaction chamber from a feeding chamber, allowing
          diffusion of substrates in and byproducts out
        aliases:
        - CECF
        - continuous exchange
        - dialysis mode
        related_mappings:
        - OBI:0600052
        annotations:
          duration: extended (up to ~24 h)
      CONTINUOUS_FLOW:
        description: >-
          Continuous-flow cell-free (CFCF) format in which fresh substrates are
          continuously pumped through the reaction while product is collected
        aliases:
        - CFCF
        - continuous flow
        annotations:
          duration: extended
      BILAYER:
        description: >-
          Bilayer format where a feeding solution is layered over the reaction
          mixture without a membrane, prolonging reaction by passive diffusion
        aliases:
        - bilayer mode
      LYOPHILIZED:
        description: >-
          Freeze-dried (lyophilized) cell-free reaction that is shelf-stable and
          activated by rehydration; basis of freeze-dried cell-free (FD-CF)
          diagnostics and portable biomanufacturing
        aliases:
        - freeze-dried
        - FD-CF
        - lyophilised
        related_mappings:
        - NCIT:C28150
        annotations:
          advantage: cold-chain-free storage and distribution

  EnergyRegenerationSubstrateEnum:
    title: Energy Regeneration Substrates
    description: >-
      Secondary energy substrates added to cell-free reactions to regenerate ATP
      and GTP consumed during transcription and translation. Choice of substrate
      affects cost, reaction longevity, and inorganic phosphate accumulation.
    status: DRAFT
    contributors:
    - orcid:0000-0002-6601-2165
    - https://github.com/anthropics/claude-code
    instantiates:
    - valuesets_meta:ValueSetEnumDefinition
    permissible_values:
      PHOSPHOCREATINE:
        description: >-
          Creatine phosphate (N-phosphocreatine) regenerated with creatine kinase;
          a classic high-energy phosphate donor
        meaning: CHEBI:17287
        aliases:
        - creatine phosphate
        - phosphocreatine
        - N-phosphocreatine
        annotations:
          enzyme: creatine kinase
      PHOSPHOENOLPYRUVATE:
        description: >-
          Phosphoenolpyruvate (PEP) regenerated with pyruvate kinase; a common
          high-energy phosphate donor
        meaning: CHEBI:18021
        aliases:
        - PEP
        annotations:
          enzyme: pyruvate kinase
      ACETYL_PHOSPHATE:
        description: >-
          Acetyl phosphate regenerated with acetate kinase; an inexpensive energy
          source
        meaning: CHEBI:15350
        aliases:
        - AcP
        - acetyl dihydrogen phosphate
        annotations:
          enzyme: acetate kinase
      THREE_PGA:
        description: >-
          3-phosphoglycerate (3-PGA), a glycolytic intermediate widely used as a
          low-cost energy substrate in E. coli cell-free systems
        meaning: CHEBI:17794
        aliases:
        - 3-PGA
        - 3-phosphoglycerate
        - 3-phospho-D-glycerate
        - 3-phospho-D-glyceric acid
      GLUCOSE:
        description: >-
          Glucose feeding glycolysis for ATP regeneration; a very low-cost energy
          source that requires phosphate buffering
        meaning: CHEBI:17634
        aliases:
        - D-glucose
      GLUCOSE_6_PHOSPHATE:
        description: Glucose 6-phosphate fed into glycolysis for energy regeneration
        meaning: CHEBI:14314
        aliases:
        - G6P
        - glucose-6-phosphate
        - D-glucose 6-phosphate
      MALTOSE:
        description: >-
          Maltose used as a low-cost energy substrate that limits inorganic
          phosphate accumulation
        meaning: CHEBI:17306
      PYRUVATE:
        description: >-
          Pyruvate used as an energy source, oxidized via the central metabolism
          of the extract
        meaning: CHEBI:15361
      MALTODEXTRIN:
        description: >-
          Maltodextrin (glucose polymer) energy substrate providing slow glucose
          release and minimal phosphate buildup
        aliases:
        - polymeric glucose

  CellFreeApplicationEnum:
    title: Cell-Free Expression Applications
    description: >-
      Common applications and use cases for cell-free protein synthesis across
      research, synthetic biology, and biomanufacturing.
    status: DRAFT
    contributors:
    - orcid:0000-0002-6601-2165
    - https://github.com/anthropics/claude-code
    instantiates:
    - valuesets_meta:ValueSetEnumDefinition
    permissible_values:
      RECOMBINANT_PROTEIN_PRODUCTION:
        description: General production of recombinant proteins in vitro
        aliases:
        - protein production
      MEMBRANE_PROTEIN_EXPRESSION:
        description: >-
          Expression of membrane proteins, often co-translationally inserted into
          liposomes, nanodiscs, or detergent micelles
        aliases:
        - membrane protein synthesis
      DIFFICULT_PROTEIN_EXPRESSION:
        description: >-
          Expression of toxic, unstable, or otherwise difficult-to-express
          proteins that are problematic in living cells
        aliases:
        - toxic protein expression
      GENETIC_CIRCUIT_PROTOTYPING:
        description: >-
          Rapid prototyping and characterization of genetic parts and circuits
          using in vitro transcription-translation (TX-TL)
        aliases:
        - TX-TL prototyping
        - circuit prototyping
      METABOLIC_PATHWAY_PROTOTYPING:
        description: >-
          Building and testing enzymatic and metabolic pathways in vitro for
          cell-free biosynthesis
        aliases:
        - cell-free metabolic engineering
        - pathway prototyping
      BIOSENSOR:
        description: >-
          Cell-free biosensors, including freeze-dried paper-based sensors for
          detecting nucleic acids, small molecules, or contaminants
        meaning: NCIT:C16350
        aliases:
        - cell-free biosensor
        - Biosensors
        exact_mappings:
        - BAO:0010264
      DIAGNOSTICS:
        description: >-
          Point-of-care and field-deployable diagnostics, often freeze-dried
          cell-free reactions coupled to toehold switches or CRISPR readouts
        aliases:
        - point-of-care diagnostics
        related_mappings:
        - NCIT:C209465
      UNNATURAL_AMINO_ACID_INCORPORATION:
        description: >-
          Site-specific incorporation of non-canonical/unnatural amino acids via
          orthogonal translation components
        aliases:
        - ncAA incorporation
        - non-canonical amino acid incorporation
      PROTEIN_LABELING:
        description: >-
          Incorporation of radioactive, fluorescent, or isotopic labels for
          detection and structural studies
        aliases:
        - isotopic labeling
        - radiolabeling
      STRUCTURAL_BIOLOGY:
        description: >-
          Production of selectively or uniformly isotope-labeled proteins for NMR
          and other structural studies
        aliases:
        - NMR labeling
      HIGH_THROUGHPUT_SCREENING:
        description: >-
          Parallelized small-volume expression for protein screening, directed
          evolution, and library characterization
        meaning: NCIT:C18472
        aliases:
        - HTS
        exact_mappings:
        - BAO:0010074
      VACCINE_PRODUCTION:
        description: >-
          On-demand cell-free production of protein subunit and conjugate vaccine
          antigens
        meaning: OBI:0000719
        aliases:
        - on-demand vaccine production
        exact_mappings:
        - NCIT:C26030
      ANTIBODY_PRODUCTION:
        description: Cell-free synthesis of antibodies and antibody fragments
        aliases:
        - antibody synthesis
      EDUCATION:
        description: Use of cell-free kits for teaching and outreach in synthetic biology
        aliases:
        - teaching
