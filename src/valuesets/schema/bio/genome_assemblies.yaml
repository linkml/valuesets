name: genome_assemblies
title: Genome Assemblies and Chromosomes
description: >-
  Value sets for reference genome builds (assemblies) and chromosome names/codes for human and
  common model organisms. Chromosome terms are mapped to the Monochrom Ontology (CHR,
  https://github.com/monarch-initiative/monochrom), which provides OWL classes for chromosomes
  and chromosome bands derived from UCSC cytoband files. Genome builds are mapped to their
  INSDC (GenBank) assembly accessions; the paired RefSeq accession and UCSC database name are
  given as annotations.
id: https://w3id.org/valuesets/bio/genome_assemblies
imports:
- linkml:types
prefixes:
  linkml: https://w3id.org/linkml/
  valuesets: https://w3id.org/valuesets/
  CHR: http://purl.obolibrary.org/obo/CHR_
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_
  insdc.gca: 'https://identifiers.org/insdc.gca:'
  orcid: https://orcid.org/
  valuesets_meta: https://w3id.org/valuesets/meta/
default_prefix: valuesets
slots:
  human_genome_build:
    description: Reference genome build (assembly) for human sequence coordinates
    range: HumanGenomeBuild
  model_organism_genome_build:
    description: Reference genome build (assembly) for a model organism
    range: ModelOrganismGenomeBuild
  human_chromosome:
    description: A human chromosome
    range: HumanChromosome
  mouse_chromosome:
    description: A mouse chromosome
    range: MouseChromosome
enums:
  HumanGenomeBuild:
    title: Human Genome Build
    description: >-
      Human (Homo sapiens) reference genome assemblies. Permissible value names follow the
      Genome Reference Consortium (GRC) / NCBI assembly names; UCSC database names (hg38, hg19,
      ...) are given as aliases. Meanings are the INSDC assembly accessions for the base (unpatched)
      release; patch releases share the same coordinate system.
    status: DRAFT
    contributors:
    - orcid:0000-0002-6601-2165
    - https://github.com/anthropics/claude-code
    instantiates:
    - valuesets_meta:ValueSetEnumDefinition
    annotations:
      taxon: NCBITaxon:9606
      stewards: https://www.ncbi.nlm.nih.gov/grc
    permissible_values:
      GRCh38:
        title: GRCh38
        description: >-
          Genome Reference Consortium Human Build 38, released December 2013. Current primary
          human reference assembly (latest patch GRCh38.p14, GCA_000001405.29).
        meaning: insdc.gca:GCA_000001405.15
        aliases:
        - hg38
        - GRCh38
        - GRCh38.p14
        annotations:
          ucsc_name: hg38
          refseq_accession: GCF_000001405.26
          ncbi_assembly_name: GRCh38
      GRCh37:
        title: GRCh37
        description: >-
          Genome Reference Consortium Human Build 37, released February 2009. UCSC hg19 is
          largely equivalent but uses a different mitochondrial sequence (NC_001807 rather than the
          rCRS NC_012920) and "chr"-prefixed sequence names.
        meaning: insdc.gca:GCA_000001405.1
        aliases:
        - hg19
        - GRCh37
        - GRCh37.p13
        - b37
        annotations:
          ucsc_name: hg19
          refseq_accession: GCF_000001405.13
          ncbi_assembly_name: GRCh37
      NCBI36:
        title: NCBI36
        description: NCBI Build 36.1 of the human genome, released March 2006. Superseded.
        aliases:
        - hg18
        - NCBI Build 36
        annotations:
          ucsc_name: hg18
          refseq_accession: GCF_000001405.12
          ncbi_assembly_name: NCBI36
      T2T_CHM13v2:
        title: T2T-CHM13v2.0
        description: >-
          Telomere-to-Telomere Consortium complete gapless assembly of the CHM13 hydatidiform mole
          cell line, version 2.0 (adds chrY from HG002), released 2022.
        meaning: insdc.gca:GCA_009914755.4
        aliases:
        - T2T-CHM13v2.0
        - CHM13v2.0
        - hs1
        annotations:
          ucsc_name: hs1
          refseq_accession: GCF_009914755.1
          ncbi_assembly_name: T2T-CHM13v2.0
