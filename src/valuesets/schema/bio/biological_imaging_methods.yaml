    status: DRAFT
    contributors:
    - orcid:0000-0002-6601-2165
    - https://github.com/anthropics/claude-code
    instantiates:
    - valuesets_meta:ValueSetEnumDefinition
    reachable_from:
      source_ontology: obo:fbbi
      source_nodes:
      - FBbi:00000001
      include_self: false
      relationship_types:
